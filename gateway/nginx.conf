events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    upstream identity_upstream {
        server identity-service:8001;
    }

    upstream catalog_upstream {
        server catalog-service:8002;
    }

    upstream orders_upstream {
        server orders-service:8003;
    }

    upstream fulfillment_upstream {
        server fulfillment-service:8004;
    }

    upstream content_upstream {
        server content-service:8005;
    }

    server {
        listen 8000;
        server_name localhost _;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Inject correlation ID
        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = "") {
            set $correlation_id $request_id;
        }
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only bearer credentials cross the public edge; services resolve identity.
        proxy_set_header X-User-ID "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Internal-Token "";

        # 1. Gateway Health Check
        location = /health/ {
            return 200 '{"status":"ok","service":"gateway","timestamp":"$time_iso8601"}';
        }

        # 2. Identity Service Routing
        location ~ ^/(signup|login|forgot-password|profile|wishlist|api/admin|api/identity)/ {
            proxy_pass http://identity_upstream;
        }

        # 3. Catalog Service Routing
        location ~ ^/(categories|products|variants|colors|cart|inventory|api/catalog)/ {
            proxy_pass http://catalog_upstream;
        }
        location ~ ^/api/merchant/(products|inventory|categories|dashboard/catalog)/ {
            proxy_pass http://catalog_upstream;
        }

        # 4. Orders Service Routing
        location ~ ^/(orders|api/orders|reviews|api/reviews)/ {
            proxy_pass http://orders_upstream;
        }
        location ~ ^/api/merchant/(orders|analytics)/ {
            proxy_pass http://orders_upstream;
        }

        # 5. Fulfillment Service Routing
        location ~ ^/(shipping-zones|shipments|notifications|api/fulfillment)/ {
            proxy_pass http://fulfillment_upstream;
        }

        # 6. Content Service Routing
        location ~ ^/(banners|contact|api/content)/ {
            proxy_pass http://content_upstream;
        }
        location ~ ^/api/merchant/(banners|contact-messages)/ {
            proxy_pass http://content_upstream;
        }
    }
}
