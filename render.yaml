# This Blueprint intentionally uses only Render's free compute plans.
# Applying it still requires an explicit human review in the Render Dashboard.
previews:
  generation: "off"

services:
  - type: web
    name: metrodripjs
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r metrodrip_backend/requirements.txt && python metrodrip_backend/manage.py collectstatic --noinput
    startCommand: python metrodrip_backend/manage.py migrate --noinput && gunicorn --chdir metrodrip_backend metrodrip_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile -
    autoDeployTrigger: "off"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metrodrip-postgres
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: PAYMONGO_MODE
        value: test
      - key: CHECKOUT_MAX_ACTIVE_ONLINE_ATTEMPTS
        value: "3"
      - key: CHECKOUT_MAX_QUANTITY_PER_VARIANT
        value: "5"
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      # Keep empty until the matching test rails and signed webhook have been
      # verified for this PayMongo account. Example: gcash,maya,card
      - key: PAYMONGO_ENABLED_METHODS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: MetroDrip
      # Email OTP uses the existing Brevo sender. These defaults match the app.
      - key: EMAIL_OTP_ENFORCED
        value: "false"
      - key: EMAIL_OTP_TTL_SECONDS
        value: "300"
      - key: EMAIL_OTP_RESEND_SECONDS
        value: "60"
      - key: EMAIL_OTP_MAX_ATTEMPTS
        value: "5"
      - key: APP_PUBLIC_BASE_URL
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_SECONDS
        value: "1800"

databases:
  - name: metrodrip-postgres
    plan: free
    ipAllowList: []
