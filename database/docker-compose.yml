version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: metrodrip-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: metrodrip
    ports:  # ← Only one ports block
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - metro-network

networks:
  metro-network:
    driver: bridge